<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>叫它一声 · DuckUp 离线互动演示</title>
<style>
:root{color-scheme:light;--ink:#153e39;--accent:#056154;--paper:#f7f6f0;--line:#c6d3c8}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Work Sans",-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:980px;margin:auto;padding:clamp(18px,5vw,68px) 20px}header{display:flex;align-items:center;gap:.75rem;border-bottom:1px solid var(--line);padding-bottom:15px;font-weight:750}header small{font-weight:400}h1{font-size:clamp(30px,5vw,60px);line-height:1.1;margin:30px 0 12px}p{line-height:1.65;margin:0 0 22px}.stage{display:grid;grid-template-columns:1.4fr 1fr;gap:clamp(14px,4vw,40px);align-items:center}canvas{width:100%;height:auto;border-radius:14px;background:#133f39}.panel{min-width:0}fieldset{border:0;padding:0;margin:0 0 14px}legend{font-weight:650;margin-bottom:8px}button{font:inherit;cursor:pointer;color:inherit;background:transparent;border:1px solid #93aca0;border-radius:8px;padding:9px 11px;min-height:44px}button[aria-pressed=true]{background:#d8eae1;border-color:var(--accent)}button:focus-visible,input:focus-visible{outline:3px solid #d08b00;outline-offset:2px}#start{display:block;width:100%;background:#f7ca55;border:1px solid #ba9237;font-weight:750;margin:12px 0}.choices{display:flex;flex-wrap:wrap;gap:5px}#status{min-height:1.6em;font-size:1.3rem;font-weight:700}.key{display:flex;gap:16px;margin:8px 0 0;font-size:12px}.key span:first-child{color:#826015}input{width:100%;accent-color:var(--accent)}footer{border-top:1px solid var(--line);padding-top:14px;margin-top:24px;font-size:.86rem;color:#446059}#clock{font-variant-numeric:tabular-nums}
@media(max-width:640px){.stage{grid-template-columns:1fr}canvas{max-height:44vh;object-fit:contain}main{padding-top:18px}h1{margin-top:20px}}
</style>
<main><header>DUCK BASE <small>互动实验室 / 离线演示</small></header><h1>在它背后，叫它一声。</h1><p>选一个位置，按「小鸭小鸭」，观察它什么时候看见你、什么时候转过身。</p>
<div class="stage"><div><canvas width="560" height="390" id="scene" aria-label="俯视图，显示人的位置、鸭子身体和头部视野"></canvas><div class="key"><span>● 你的位置</span><span>扇形：头部视野</span></div></div><section class="panel"><fieldset><legend>你站在哪里？</legend><div class="choices">
<button data-key="rear">正后方</button><button data-key="left">左侧</button><button data-key="front">正前方</button><button data-key="empty">空场</button></div></fieldset>
<button id="start">小鸭小鸭</button><div id="status" aria-live="polite"></div><div id="clock"></div><label for="seek">回放进度</label><input type="range" min="0" value="0" id="seek">
</section></div><footer>按键代替呼唤，人物与视野由二维程序模拟。回放以 2 倍速播放，显示时间为模型时间。此页在浏览器内运行，无需摄像头、麦克风或机械鸭。</footer></main>
<script>
const traces=/*TRACES*/;
const canvas=document.querySelector("#scene"),ctx=canvas.getContext("2d");
const statusLine=document.querySelector("#status"),clock=document.querySelector("#clock"),seek=document.querySelector("#seek"),start=document.querySelector("#start");
let key="rear",index=0,timer=null,begun=false,startTime=0;
const rad=d=>d*Math.PI/180;
function stop(){if(timer!==null)cancelAnimationFrame(timer);timer=null}
function draw(){
  const run=traces[key], frame=run.frames[index], [body,head,phase,seen]=frame, cx=280, cy=195;
  ctx.clearRect(0,0,560,390);ctx.save();ctx.translate(cx,cy);
  ctx.strokeStyle="#39645b";ctx.lineWidth=1;
  for(const r of [55,100,148]){ctx.beginPath();ctx.arc(0,0,r,0,2*Math.PI);ctx.stroke()}
  ctx.save();ctx.rotate(-rad(body+head));ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,180,-Math.PI/2-rad(38),-Math.PI/2+rad(38));ctx.closePath();ctx.fillStyle="#437a67";ctx.fill();ctx.restore();
  if(run.bearing!==null){const a=rad(run.bearing);ctx.save();ctx.translate(-145*Math.sin(a),-145*Math.cos(a));ctx.fillStyle="#ffcd5b";ctx.beginPath();ctx.arc(0,-8,7,0,2*Math.PI);ctx.fill();ctx.fillRect(-8,2,16,13);ctx.restore()}
  ctx.save();ctx.rotate(-rad(body));ctx.fillStyle="#f4f5e9";ctx.beginPath();ctx.ellipse(0,5,16,24,0,0,2*Math.PI);ctx.fill();
  ctx.fillStyle="#ffbd54";ctx.fillRect(-22,12,8,15);ctx.fillRect(14,12,8,15);ctx.rotate(-rad(head));ctx.fillStyle="#d8ebe4";ctx.beginPath();ctx.arc(0,-9,13,0,2*Math.PI);ctx.fill();ctx.fillStyle="#ffbd54";ctx.beginPath();ctx.moveTo(-7,-18);ctx.lineTo(0,-32);ctx.lineTo(7,-18);ctx.fill();ctx.restore();ctx.restore();
  const label=!begun?"等你呼唤":phase==="dialogue"?"已面向你，可以对话":phase==="idle"?"没有找到人，结束搜索":phase==="align"||seen?"找到你了，身体正在对正":index<60?"左右转头，寻找人影":"原地转身，停下来观察";
  if(statusLine.textContent!==label)statusLine.textContent=label;
  clock.textContent=(index/10).toFixed(1)+" 秒 · 身体 "+Math.round(body)+"° · 头部 "+Math.round(head)+"°";
  seek.max=run.frames.length-1;seek.value=index;
}
function play(now){
  index=Math.max(0,Math.min(Math.floor((now-startTime)/50),traces[key].frames.length-1));draw();
  if(index>=traces[key].frames.length-1){timer=null;start.textContent="再叫一次";return}
  timer=requestAnimationFrame(play);
}
function choose(k){stop();key=k;begun=false;index=0;start.textContent="小鸭小鸭";document.querySelectorAll("[data-key]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.key===k)));draw()}
document.querySelectorAll("[data-key]").forEach(b=>b.onclick=()=>choose(b.dataset.key));
start.onclick=()=>{if(timer!==null){stop();start.textContent="继续回放";return}if(index>=traces[key].frames.length-1)index=0;begun=true;start.textContent="暂停";startTime=performance.now()-index*50;timer=requestAnimationFrame(play)};
seek.oninput=()=>{stop();begun=true;index=Number(seek.value);start.textContent=index===traces[key].frames.length-1?"再叫一次":"继续回放";draw()};
choose("rear");
</script></html>
